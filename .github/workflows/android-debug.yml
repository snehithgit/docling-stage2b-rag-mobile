name: ShipRAG Android — build and test

on:
  push:
    branches:
      - main
      - 'shiprag/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using preinstalled SDK manager
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate synthetic RAG backup
        run: |
          python3 scripts/generate_fixture.py /tmp/shiprag-smoke-test.zip
          python3 scripts/smoke_check.py /tmp/shiprag-smoke-test.zip
      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShipRAG-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error