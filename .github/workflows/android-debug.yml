name: ShipRAG Android — build and test

on:
  push:
    branches:
      - main
      - 'shiprag/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate synthetic RAG backup
        run: |
          python3 scripts/generate_fixture.py /tmp/shiprag-smoke-test.zip
          python3 scripts/smoke_check.py /tmp/shiprag-smoke-test.zip
      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShipRAG-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error